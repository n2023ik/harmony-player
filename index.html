<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <main class="music-player">
            <div class="header">
                <h1>Harmony Player</h1>
            </div>

            <div class="player-content">
                <div class="album-art-container">
                    <div class="vinyl">
                        <div class="vinyl-inner">
                            <img src="https://placehold.co/300x300" alt="Album cover" class="album-cover" id="album-cover">
                        </div>
                    </div>
                    <div class="tonearm" aria-hidden="true"></div>
                </div>

                <div class="song-info" aria-live="polite">
                    <h2 class="song-title" id="song-title">No song selected</h2>
                    <p class="artist" id="artist">--</p>
                </div>

                <div class="progress-container" id="progress-container" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <div class="controls">
                    <button class="control-btn" id="shuffle-btn" title="Shuffle (S)" aria-label="Shuffle" aria-pressed="false">
                        <i class="fas fa-random"></i>
                    </button>
                    <button class="control-btn" id="prev-btn" title="Previous (P)" aria-label="Previous">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="control-btn play-btn" id="play-btn" title="Play (Space)" aria-label="Play">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="control-btn" id="next-btn" title="Next (N)" aria-label="Next">
                        <i class="fas fa-step-forward"></i>
                    </button>
                    <button class="control-btn" id="repeat-btn" title="Repeat (R)" aria-label="Repeat" aria-pressed="false">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>

                <div class="volume-control">
                    <button class="volume-btn" id="volume-btn" title="Mute (M)" aria-label="Mute">
                        <i class="fas fa-volume-down" id="volume-icon"></i>
                    </button>
                    <input type="range" id="volume-slider" aria-label="Volume" min="0" max="1" step="0.01" value="0.7">
                </div>
                <p class="status-msg" id="status-msg" role="status"></p>
            </div>

            <div class="playlist-container">
                <div class="playlist-header">
                    <h3><i class="fas fa-list"></i> Playlist</h3>
                    <input type="text" id="playlist-search" class="playlist-search" placeholder="Search..." aria-label="Search playlist" autocomplete="off">
                </div>
                <div class="playlist-scroll" id="playlist-scroll">
                    <ul id="playlist"></ul>
                </div>
            </div>

            <p class="shortcuts-hint">Space play/pause · ←/→ seek · ↑/↓ volume · N/P next/prev · S shuffle · R repeat · M mute</p>
        </main>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
